filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/app/*.json.log
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message

    exclude_files: ['\.gz$']
    close_inactive: 30m
    scan_frequency: 5s

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info