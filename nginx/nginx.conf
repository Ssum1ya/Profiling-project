load_module modules/ngx_http_js_module.so; # подгружаем njs

user nginx;
worker_processes  auto; // создаём столько воркеров сколько CPU ядер

events {
    worker_connections  1024; // максимальное число коннектов, которое может обслуживать 1 воркер
}

http {
    include       mime.types;
    default_type  application/xml;

    js_import main from /etc/nginx/echo.js; // подгружаем echo файл, в котором логика обработки запросов

    server {
        listen 80; // слушаем 80 порт

        location / {
            js_content main.reply; // для каждого запроса используй reply метод, который у нас в echo.js
        }
    }
}
