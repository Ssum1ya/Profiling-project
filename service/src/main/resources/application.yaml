spring:
  application:
    name: project_profile

  data:
    redis:
      host: localhost
      port: 6379
      password: semechko

management:
  info:
    env:
      enabled: true

  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "{http.server.requests}": true

  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info

info:
  app:
    name: service
    version: 0.0.1
    description: test service for profile

server:
  port: 8080
  servlet:
    context-path: /api