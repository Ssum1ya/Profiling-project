load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/xml;

    js_import main from /etc/nginx/echo.js;

    server {
        listen 80;

        location / {
            js_content main.reply;
        }
    }
}
