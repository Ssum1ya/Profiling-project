apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
    
      - job_name: profile-service
    
        metrics_path: /api/actuator/prometheus
    
        static_configs:
          - targets:
              - profile-monitoring:8080
    
      - job_name: timing-agent
    
        metrics_path: /metrics
    
        static_configs:
          - targets:
              - profile-monitoring:9911