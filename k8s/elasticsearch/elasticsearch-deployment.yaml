apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch

spec:
  replicas: 1

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch

    spec:
      volumes:
        - name: elastic-data
          emptyDir: { }

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"

            limits:
              memory: "1Gi"
              cpu: "1"
          ports:
            - name: http
              containerPort: 9200

          volumeMounts:
            - name: elastic-data
              mountPath: /usr/share/elasticsearch/data