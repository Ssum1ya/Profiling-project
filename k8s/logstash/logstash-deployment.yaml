apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash

spec:
  replicas: 1

  selector:
    matchLabels:
      app: logstash

  template:
    metadata:
      labels:
        app: logstash

    spec:
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config

      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.3
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          ports:
            - name: beats
              containerPort: 5044

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"

            limits:
              memory: "1Gi"
              cpu: "1000m"

          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf